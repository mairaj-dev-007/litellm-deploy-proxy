version: "3.8"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm}
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-litellm}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:alpine
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm-database:main-stable
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://$${POSTGRES_USER:-litellm}:$${POSTGRES_PASSWORD:-litellm}@postgres:5432/$${POSTGRES_DB:-litellm}
      REDIS_URL: redis://redis:6379
      LITELLM_LOG: WARNING
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "4000:4000"
    restart: on-failure

  proxy:
    image: nginx:alpine
    depends_on:
      - litellm
    ports:
      - "85:80"
    #volumes:
     # - ./nginx.conf:/etc/nginx/nginx.conf:ro
    volumes:
     - type: bind
       source: ./nginx.conf
       target: /etc/nginx/nginx.conf
       restart: always

volumes:
  postgres_data:
  redis_data:
